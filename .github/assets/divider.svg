<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="10" viewBox="0 0 1000 10" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B63CE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0B63CE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0B63CE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DB6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BFDBFE" stop-opacity="1"/>
      <stop offset="1" stop-color="#7DB6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base line -->
  <rect x="0" y="4" width="1000" height="2" rx="1" fill="url(#line)"/>

  <!-- Moving light streak -->
  <rect x="-160" y="3.5" width="160" height="3" rx="1.5" fill="url(#shine)">
    <animate attributeName="x" from="-160" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Center pulse -->
  <circle cx="500" cy="5" r="3" fill="#0B63CE">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
