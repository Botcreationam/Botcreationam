      <rect x="1244" y="8" width="147" height="32" rx="16" fill="#111827"/><text x="1317.5" y="29">Notifications</text>
      <rect x="1405" y="8" width="113" height="32" rx="16" fill="#0B63CE"/><text x="1461.5" y="29">Peer Help</text>
    </g>
