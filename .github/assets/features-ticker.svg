<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="48" viewBox="0 0 1000 48" role="img" aria-label="UNIVO features: Social Feed, Communities, Messaging, Study AI, Resources, Accommodation, Roommate Finder, Marketplace, Events, Notifications, Peer Help" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
