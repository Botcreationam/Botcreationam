  <g mask="url(#fade)">
    <g>
      <use href="#chips" xlink:href="#chips" x="0"/>
      <use href="#chips" xlink:href="#chips" x="1532"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1532 0" dur="32s" repeatCount="indefinite"/>
