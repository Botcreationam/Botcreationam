      <rect x="144"  y="8" width="130" height="32" rx="16" fill="#111827"/><text x="209"  y="29">Communities</text>
      <rect x="288"  y="8" width="113" height="32" rx="16" fill="#0B63CE"/><text x="344.5" y="29">Messaging</text>
      <rect x="415"  y="8" width="104" height="32" rx="16" fill="#111827"/><text x="467"  y="29">Study AI</text>
      <rect x="533"  y="8" width="113" height="32" rx="16" fill="#0B63CE"/><text x="589.5" y="29">Resources</text>
      <rect x="660"  y="8" width="147" height="32" rx="16" fill="#111827"/><text x="733.5" y="29">Accommodation</text>
      <rect x="821"  y="8" width="164" height="32" rx="16" fill="#0B63CE"/><text x="903"  y="29">Roommate Finder</text>
