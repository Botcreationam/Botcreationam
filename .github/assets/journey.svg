<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="The UNIVO journey: Connect, Communicate, Learn, Discover, Grow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pill  { fill: #111827; stroke: #1F2937; stroke-width: 1.5; }
    .glow  { fill: #0B63CE; stroke: #60A5FA; stroke-width: 1.5; opacity: 0;
             animation: glow 5s ease-in-out infinite; }
    .label { font: 700 14px 'Segoe UI', Inter, Arial, sans-serif; letter-spacing: 1.6px;
             fill: #FFFFFF; text-anchor: middle; }
    .arrow { stroke: #0B63CE; stroke-width: 2.5; fill: none; stroke-linecap: round;
             stroke-linejoin: round; opacity: 0.25; animation: flow 5s ease-in-out infinite; }
    @keyframes glow { 0% { opacity: 0; } 6% { opacity: 1; } 20% { opacity: 1; } 28% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes flow { 0% { opacity: 0.25; } 12% { opacity: 1; } 30% { opacity: 0.25; } 100% { opacity: 0.25; } }
  </style>

  <!-- Arrows -->
  <path class="arrow" style="animation-delay:0s" d="M170 45 H206 M199 38 L206 45 L199 52"/>
  <path class="arrow" style="animation-delay:1s" d="M378 45 H414 M407 38 L414 45 L407 52"/>
  <path class="arrow" style="animation-delay:2s" d="M586 45 H622 M615 38 L622 45 L615 52"/>
  <path class="arrow" style="animation-delay:3s" d="M794 45 H830 M823 38 L830 45 L823 52"/>

  <!-- Pills -->
  <rect class="pill" x="10"  y="23" width="148" height="44" rx="22"/>
  <rect class="glow" style="animation-delay:0s" x="10"  y="23" width="148" height="44" rx="22"/>
  <text class="label" x="84"  y="50">CONNECT</text>

  <rect class="pill" x="218" y="23" width="148" height="44" rx="22"/>
  <rect class="glow" style="animation-delay:1s" x="218" y="23" width="148" height="44" rx="22"/>
  <text class="label" x="292" y="50">COMMUNICATE</text>

  <rect class="pill" x="426" y="23" width="148" height="44" rx="22"/>
  <rect class="glow" style="animation-delay:2s" x="426" y="23" width="148" height="44" rx="22"/>
  <text class="label" x="500" y="50">LEARN</text>

  <rect class="pill" x="634" y="23" width="148" height="44" rx="22"/>
  <rect class="glow" style="animation-delay:3s" x="634" y="23" width="148" height="44" rx="22"/>
  <text class="label" x="708" y="50">DISCOVER</text>

  <rect class="pill" x="842" y="23" width="148" height="44" rx="22"/>
  <rect class="glow" style="animation-delay:4s" x="842" y="23" width="148" height="44" rx="22"/>
  <text class="label" x="916" y="50">GROW</text>
</svg>

