<svg xmlns="http://www.w3.org/2000/svg" width="700" height="210" viewBox="0 0 700 210" role="img" aria-label="Animated preview of UNIVO Study AI answering a student's question about photosynthesis" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text    { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
    .title  { font-size: 13px; font-weight: 600; fill: #E2E8F0; }
    .status { font-size: 11px; fill: #94A3B8; }
    .msg    { font-size: 13px; fill: #FFFFFF; }
    .ai     { font-size: 13px; fill: #E2E8F0; }
    .live   { fill: #22C55E; animation: live 2s ease-in-out infinite; }
    .dot    { fill: #94A3B8; animation: dot 1.2s ease-in-out infinite; }
    .user   { opacity: 0; animation: user 10s ease-in-out infinite; }
    .typing { opacity: 0; animation: typing 10s ease-in-out infinite; }
    .reply  { opacity: 0; animation: reply 10s ease-in-out infinite; }

    @keyframes live   { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes dot    { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @keyframes user   { 0%, 3% { opacity: 0; transform: translateY(8px); }
                        8%, 94% { opacity: 1; transform: translateY(0); }
                        100% { opacity: 0; transform: translateY(0); } }
    @keyframes typing { 0%, 10% { opacity: 0; } 13%, 37% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes reply  { 0%, 40% { opacity: 0; transform: translateY(6px); }
                        46%, 94% { opacity: 1; transform: translateY(0); }
                        100% { opacity: 0; transform: translateY(0); } }
  </style>

  <!-- Card -->
  <rect x="0.5" y="0.5" width="699" height="209" rx="16" fill="#0F172A" stroke="#1E293B"/>

  <!-- Header -->
  <circle cx="28" cy="22" r="11" fill="#0B63CE"/>
  <text x="28" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">U</text>
  <text class="title" x="48" y="27">UNIVO Study AI</text>
  <circle class="live" cx="634" cy="22" r="4"/>
  <text class="status" x="644" y="26">Online</text>
  <line x1="0" y1="44" x2="700" y2="44" stroke="#1E293B"/>

  <!-- Student question -->
  <g class="user">
    <rect x="340" y="62" width="330" height="38" rx="14" fill="#0B63CE"/>
    <text class="msg" x="505" y="86" text-anchor="middle">Explain photosynthesis in simple terms</text>
  </g>

  <!-- AI typing indicator -->
  <g class="typing">
    <rect x="30" y="118" width="66" height="36" rx="14" fill="#1E293B"/>
    <circle class="dot" style="animation-delay:0s"   cx="50" cy="136" r="4"/>
    <circle class="dot" style="animation-delay:0.2s" cx="63" cy="136" r="4"/>
    <circle class="dot" style="animation-delay:0.4s" cx="76" cy="136" r="4"/>
  </g>

  <!-- AI reply -->
  <g class="reply">
    <rect x="30" y="118" width="400" height="70" rx="14" fill="#1E293B"/>
    <text class="ai" x="48" y="143">Plants turn sunlight, water and CO2 into glucose</text>
    <text class="ai" x="48" y="165">and oxygen, which is how they make their own food.</text>
  </g>
</svg>

